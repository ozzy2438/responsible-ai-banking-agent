name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Reject generated state and verify fixed suite
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- '.env' '.env.*' ':!.env.example' '*.pem' '*.key' '*.p12' '*.pfx' 'secrets/**' '.local/**')"
          test -z "$tracked"
          git diff --check
          python -c "import json; cases=json.load(open('evaluation/golden_cases.json')); assert len(cases) == 48"

  quality:
    name: Ruff and strict typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/unit -q

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: banking
          POSTGRES_USER: banking_migration
          POSTGRES_PASSWORD: migration-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking_migration -d banking"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      IDENTITY_PROVIDER: simulated
      REASONING_PROVIDER: stub
      DATABASE_URL: postgresql://banking_app:app-local-only@127.0.0.1:5432/banking
      TEST_DATABASE_URL: postgresql://banking_app:app-local-only@127.0.0.1:5432/banking
      MIGRATION_DATABASE_URL: postgresql://banking_migration:migration-local-only@127.0.0.1:5432/banking
      APP_DB_PASSWORD: app-local-only
      POLICY_BUNDLE_PATH: policies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/integration -q

  policy-evaluations:
    name: Policy evaluations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/evaluation -q

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate browser JavaScript syntax
        run: |
          node --check src/responsible_banking_agent/static/landing.js
          node --check src/responsible_banking_agent/static/demo.js
      - name: Validate and start the packaged demo stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose up --build --detach --wait
          app_container="$(docker compose ps --quiet app)"
          test "$(docker inspect -f '{{.Config.User}}' "$app_container")" = "10001:10001"
          python3 scripts/demo_smoke.py
      - name: Prove a recreated demo does not reuse stale evidence
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql \
            --username banking_migration --dbname banking --set ON_ERROR_STOP=1 \
            --command "UPDATE accounts SET updated_at = now() - interval '2 days' WHERE id = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';"
          docker compose down --volumes --remove-orphans
          docker compose up --detach --wait
          python3 scripts/demo_smoke.py
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the synthetic demo stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip==26.2
      - run: python -m pip install -e ".[test]"
      - run: pip-audit

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-security:
    name: Static security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: bandit -q -r src

  filesystem-vulnerability:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  image-vulnerability:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: responsible-banking-agent:scan
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: responsible-banking-agent:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
