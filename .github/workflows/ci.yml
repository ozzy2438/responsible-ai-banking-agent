name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Reject generated state and verify fixed suite
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- '.env' '.env.*' ':!.env.example' '*.pem' '*.key' '.local/**')"
          test -z "$tracked"
          git diff --check
          python -c "import json; cases=json.load(open('evaluation/golden_cases.json')); assert len(cases) == 48"

  quality:
    name: Ruff and strict typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/unit -q

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: banking
          POSTGRES_USER: banking_migration
          POSTGRES_PASSWORD: migration-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking_migration -d banking"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      IDENTITY_PROVIDER: simulated
      REASONING_PROVIDER: stub
      DATABASE_URL: postgresql://banking_app:app-local-only@127.0.0.1:5432/banking
      TEST_DATABASE_URL: postgresql://banking_app:app-local-only@127.0.0.1:5432/banking
      MIGRATION_DATABASE_URL: postgresql://banking_migration:migration-local-only@127.0.0.1:5432/banking
      APP_DB_PASSWORD: app-local-only
      POLICY_BUNDLE_PATH: policies
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/integration -q

  policy-evaluations:
    name: Policy evaluations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/evaluation -q

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: responsible-banking-agent:ci
      - name: Run as non-root and smoke health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name responsible-banking-smoke \
            --read-only --tmpfs /tmp --tmpfs /app/.local:uid=10001,gid=10001,mode=0700 \
            -p 18000:8000 \
            -e APP_ENV=test -e IDENTITY_PROVIDER=simulated -e REASONING_PROVIDER=stub \
            -e DATABASE_URL=postgresql://unused -e POLICY_BUNDLE_PATH=policies \
            -e SESSION_COOKIE_SECURE=false \
            responsible-banking-agent:ci /bin/sh -c \
            'banking-agent-identities && exec uvicorn responsible_banking_agent.app:create_app --factory --host 0.0.0.0 --port 8000'
          test "$(docker inspect -f '{{.Config.User}}' responsible-banking-smoke)" = "10001:10001"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/healthz; then exit 0; fi
            echo "Waiting for container health (${attempt}/30)"
            sleep 1
          done
          docker logs responsible-banking-smoke
          exit 1
      - name: Remove smoke container
        if: always()
        run: docker rm -f responsible-banking-smoke || true

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pip-audit

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-security:
    name: Static security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: bandit -q -r src

  filesystem-vulnerability:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  image-vulnerability:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: responsible-banking-agent:scan
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: responsible-banking-agent:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
